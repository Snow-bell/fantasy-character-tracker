[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-character-tracker"
version = "1.0.0"
description = "Fantasy RPG character tracker built with OOP principles, polymorphic class hierarchies, and Binary Search Trees for efficient character management."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    name = "Michael Bell"
]
keywords = ["bst", "binary-search-tree", "character-tracker", "oop", "polymorphism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Snow-bell/fantasy-character-tracker"
Documentation = "https://github.com/Snow-bell/fantasy-character-tracker/tree/main/docs"
Repository = "https://github.com/Snow-bell/fantasy-character-tracker.git"
Issues = "https://github.com/Snow-bell/fantasy-character-tracker/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
fantasy-tracker = "dnd_tracker.main:main"

[tool.setuptools]
packages = ["dnd_tracker"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/dnd_tracker --cov-report=term-local --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100